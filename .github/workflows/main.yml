name: Docker Image CI/CD for LifeGoals

# El flujo se disparará automáticamente al hacer push a la rama master o main
on:
  push:
    branches: [ "master", "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Descarga el código fuente del repositorio en el servidor de GitHub
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Inicia sesión en Docker Hub usando los secretos que configuramos en el Paso 1
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    # 3. Compila el Dockerfile, genera la imagen y la sube (push) a Docker Hub
    # Reemplaza 'tu_usuario_docker' por tu nombre de usuario real de Docker Hub
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/lifegoals:latest
          ${{ secrets.DOCKER_USERNAME }}/lifegoals:${{ github.sha }}

# NUEVO PASO: Notificar a Render para automatizar el despliegue - name: 
    Trigger Render Deploy
      run: |
        curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
